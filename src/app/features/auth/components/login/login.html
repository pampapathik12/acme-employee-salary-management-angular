<div class="login-page">
  <div class="login-card">
    <h2>Salary Management System</h2>
    <p class="subtitle">Sign in to continue</p>

    @if (error()) {
      <p-message severity="error" [closable]="false" styleClass="w-full">{{ error() }}</p-message>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <div class="form-field">
        <label for="email">Email</label>
        <input pInputText id="email" type="email" formControlName="email" autocomplete="username" class="w-full" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="p-error">Enter a valid email address.</small>
        }
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <p-password
          inputId="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="current-password"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="p-error">Password is required.</small>
        }
      </div>

      <p-button type="submit" label="Sign in" icon="pi pi-sign-in" styleClass="w-full" [loading]="loading()" [disabled]="loading()" />
    </form>
  </div>
</div>
